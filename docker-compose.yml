services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - model-cache:/root/.cache
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s

  ui:
    build: .
    command: ["streamlit", "run", "demo_v2.py", "--server.address=0.0.0.0", "--server.port=8501"]
    env_file: .env
    environment:
      ALADDIN_API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  model-cache:
